services:
  postgres:
    image: postgres:16-alpine
    container_name: ikr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ikr}
      POSTGRES_USER: ${DB_USERNAME:-ikr}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ikr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ikr} -d ${DB_NAME:-ikr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ikr-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
             else
               redis-server --appendonly yes;
             fi'
    volumes:
      - redis_data:/data
    networks:
      - ikr-network
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
                 redis-cli -a "$$REDIS_PASSWORD" ping;
               else
                 redis-cli ping;
               fi'
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ikr}
      DB_USERNAME: ${DB_USERNAME:-ikr}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT24H}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-https://16-16-236-149.sslip.io/api/v1/kite/callback}
      KITE_TOKEN_ENCRYPTION_KEY: ${KITE_TOKEN_ENCRYPTION_KEY:-}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-*}
    networks:
      - ikr-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: ikr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ikr-certbot-conf:/etc/letsencrypt:ro
      - ikr-certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - ikr-network

  certbot:
    image: certbot/certbot:latest
    container_name: ikr-certbot
    volumes:
      - ikr-certbot-conf:/etc/letsencrypt
      - ikr-certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

networks:
  ikr-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ikr-certbot-conf:
    external: true
  ikr-certbot-www:
    external: true
