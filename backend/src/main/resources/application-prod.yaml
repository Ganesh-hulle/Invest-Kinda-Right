server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:PT24H}

kite:
  api-key: ${KITE_API_KEY:}
  api-secret: ${KITE_API_SECRET:}
  redirect-url: ${KITE_REDIRECT_URL:http://localhost:8080/api/v1/kite/callback}
  api-base-url: ${KITE_API_BASE_URL:https://api.kite.trade}
  token-encryption-key: ${KITE_TOKEN_ENCRYPTION_KEY:}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/ikr}
    username: ${DB_USERNAME:ikr}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          '[time_zone]': Asia/Kolkata
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

market-data:
  websocket-url: ${KITE_WS_URL:wss://ws.kite.trade}
  websocket-mode: ${KITE_WS_MODE:full}
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}
