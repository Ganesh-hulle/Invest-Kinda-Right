server:
  port: 8080

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/ikr
    username: ikr
    password: localpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration