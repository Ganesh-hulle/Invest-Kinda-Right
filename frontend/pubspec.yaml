name: invest_kinda_right
description: A production-grade intraday algorithmic trading companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3+1

  # State management
  provider: ^6.1.2

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # WebSocket
  web_socket_channel: ^3.0.1

  # Navigation
  go_router: ^14.2.7

  # URL launcher (Kite OAuth)
  url_launcher: ^6.3.0

  # Fonts
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Shimmer loading
  shimmer: ^3.0.0

  # Number / date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
