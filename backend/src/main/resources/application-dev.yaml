server:
  port: 8080

jwt:
  secret: "++PWr0Ddh9aNq4n9FbgRoGJ0Xzukp1sM2UVRoX4LX+I=" #DEV KEY. to be changed in production
  expiration: ${JWT_EXPIRATION:PT1H}

kite:
  api-key: ${KITE_API_KEY:}
  api-secret: ${KITE_API_SECRET:}
  redirect-url: ${KITE_REDIRECT_URL:http://localhost:8080/api/v1/kite/callback}
  api-base-url: ${KITE_API_BASE_URL:https://api.kite.trade}
  token-encryption-key: ${KITE_TOKEN_ENCRYPTION_KEY:}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ikr
    username: ikr
    password: localpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          '[time_zone]': Asia/Kolkata
        '[format_sql]': true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

market-data:
  dev-tick-endpoint-enabled: ${DEV_TICK_ENDPOINT_ENABLED:true}
