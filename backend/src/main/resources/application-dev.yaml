server:
  port: 8080

jwt:
  secret: "++PWr0Ddh9aNq4n9FbgRoGJ0Xzukp1sM2UVRoX4LX+I=" #DEV KEY. to be changed in production
  expiration: ${JWT_EXPIRATION:PT1H}

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/ikr
    username: ikr
    password: localpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          '[time_zone]': Asia/Kolkata
        '[format_sql]': true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
