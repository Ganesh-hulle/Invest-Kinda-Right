kite:
  api-key: ${KITE_API_KEY}
  api-secret: ${KITE_API_SECRET}
  redirect-url: ${KITE_REDIRECT_URL}
  api-base-url: ${KITE_API_BASE_URL:https://api.kite.trade}
  token-encryption-key: ${KITE_TOKEN_ENCRYPTION_KEY}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ikr}
    username: ${DB_USERNAME:ikr}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
